<style>

.chip:active{transform:translateY(3px);border-bottom-width:1px}
.chip b{display:block;font-size:1.2rem;line-height:1.15}.chip small{display:block;color:var(--mu);font-size:.72rem;font-weight:700}

.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;transition:gap .4s}

.slots.m{gap:0}.slots.m .slot{border:0;border-radius:0;background:var(--g);color:#04210f}

.cta{background:linear-gradient(180deg,#22c55e,#10b981);color:#04210f;box-shadow:0 4px 0 var(--gd)}
.sec{background:var(--sl);border:1px solid var(--bd);box-shadow:0 4px 0 #1e293b;font-weight:800}
.cta:active,.sec:active{transform:translateY(4px);box-shadow:none}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:9px;transition:width .4s}
.qp{flex:none;display:flex;align-items:center;gap:.6rem}.qp .bar{flex:1}.qp small{color:var(--mu)}
.opts{width:100%;display:grid;gap:.45rem}
.opt{display:flex;align-items:center;gap:.7rem;padding:.55rem .8rem;border-radius:14px;border:1px solid var(--bd);border-bottom:4px solid #1e293b;background:var(--sl);font-size:1.05rem;font-weight:800;text-align:left}
.opt:active{transform:translateY(3px);border-bottom-width:1px}.opt .lt{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);font-size:.8rem}
.opt.right{background:#22c55e;color:#04210f;border-color:#22c55e;border-bottom-color:#15803d}
.opt.wrong{background:#ef4444;color:#fff;border-color:#ef4444;border-bottom-color:#b91c1c;animation:shakeX .5s}

@keyframes shakeX{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.fb{font-weight:800}.fb.ok{color:var(--g)}

.sq input{width:100%;font:inherit;font-size:16px;padding:.75rem .9rem;border-radius:14px;border:1px solid var(--bd);background:var(--bg);color:#fff;outline:none}.sq input:focus{border-color:var(--g)}
.vf{display:flex;gap:.4rem}.vf span{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:.3rem .1rem;font-size:.7rem;color:var(--mu)}.vf b{display:block;color:#fff;font-size:.85rem}
.tn{margin-top:.45rem;padding:.45rem .7rem;border-left:3px solid var(--g);background:var(--bg);border-radius:8px;text-align:left;font-size:.92rem}.tn small{display:block;color:var(--mu);font-size:.74rem}

.bk{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem;overflow:hidden;text-align:center}
.lcard{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;width:100%;padding:.7rem .9rem;border-radius:16px;border:1px solid var(--bd);border-bottom:4px solid #1e293b;background:var(--sl);text-align:left}
.lcard:active{transform:translateY(3px);border-bottom-width:1px}.lcard b{font-size:1.05rem}.lcard small{color:var(--mu)}

.wgrid{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;overflow-y:auto;min-height:0}.wgrid .chip{min-width:0;padding:.3rem .6rem}.wgrid .chip b{font-size:.9rem}

.w{border-bottom:2px solid transparent;border-radius:3px;cursor:pointer}.w.k{border-bottom-color:var(--g)}.w.h{border-bottom:2px dotted var(--mu)}.w:active{background:rgba(34,197,94,.25)}

<body>
<div id="splash"><div class="orb lg"></div><h1>इंग्लिश शब्द तोड़ो</h1><div class="ld"><i></i></div><p>लोड हो रहा है...</p></div>
<div id="app">

</div>
<script>

}

  const L=WORDS.filter(w=>w.lv===lv),q=L[Math.floor(Math.random()*L.length)],o=shuf([q,...shuf(L.filter(z=>z!==q)).slice(0,3)]);
  Q={q,o,done:false};
  $('#main').innerHTML=seg(lv,'setLvQ')+'<div class="qp"><div class="bar"><i style="width:'+qn*10+'%"></i></div><small>'+qn+' / 10</small></div><section class="card lc"><div class="em">'+(EM[q.w]||'📘')+'</div><div class="mn">'+q.m+'</div><div class="cnt">इसका English word कौन सा है?</div><div class="opts">'+o.map((x,k)=>'<button class="opt" onclick="ans('+k+')"><span class="lt">'+'ABCD'[k]+'</span>'+x.w+'</button>').join('')+'</div><div id="qf" style="width:100%"></div></section>';
}
function ans(k){
  if(!Q||Q.done)return;Q.done=true;qn++;
  const ok=Q.o[k]===Q.q,B=$$('.opt');
  B[Q.o.indexOf(Q.q)].classList.add('right');if(!ok)B[k].classList.add('wrong');
  if(ok){qok++;chime();addXP(10);setTimeout(()=>say(Q.q.w),350)}else{buzz();loseHeart()}
  if(qn>=10&&qok>=7)setTimeout(()=>{addXP(20);confetti()},500);
  $('#qf').innerHTML='<div class="fb '+(ok?'ok':'')+'">'+(ok?'✅ Correct!':'सही जवाब: <b>'+Q.q.w+'</b>')+'</div><button class="cta" style="width:100%;margin-top:.4rem" onclick="quiz()">'+(qn>=10?'Finish':'आगे चलो →')+'</button>';
}
/* ---- book: textbook words, stories, my own passage ---- */
const mkV=t=>t.split('\n').map(l=>{const a=l.split('|');return{w:a[0],s:a[1].split('·'),h:a[2].split('-'),m:a[3]}});
const BK=[
{t:'The Pace for Living',a:'R.C. Hutchinson',g:'लेखक बताता है कि आज की ज़िंदगी में हर चीज़ बहुत तेज़ हो गई है। एक नाटक का बूढ़ा व्यापारी तेज़ रफ़्तार से घबराता है, और लेखक खुद को धीमा सोचने वाला बताता है। वो कहता है कि मशीनों की दौड़ में दिमाग़ से भी वैसी ही रफ़्तार माँगी जाती है, जो हर किसी के लिए आसान नहीं।',v:mkV(`dicky|dick·y|डिक-की|कमज़ोर (बोलचाल में)
fanciful|fan·ci·ful|फैन-सि-फुल|बहुत कल्पना वाला
despair|de·spair|डि-स्पेयर|पूरी निराशा
enchanting|en·chant·ing|इन-चान-टिंग|जादू-सा मोहने वाला
illustration|il·lus·tra·tion|इल-अस-ट्रे-शन|उदाहरण
adore|a·dore|अ-डोर|बहुत प्यार और सम्मान करना
superficial|su·per·fi·cial|सू-पर-फि-शल|ऊपरी, सतही
prejudice|prej·u·dice|प्रेज-अ-डिस|पहले से बनाई हुई राय, पूर्वाग्रह
devastating|dev·as·tat·ing|डेव-अस-टे-टिंग|तबाह कर देने वाला
blonde|blonde|ब्लॉन्ड|सुनहरे बालों वाली औरत
brunette|bru·nette|ब्रू-नेट|भूरे या काले बालों वाली औरत
exceptional|ex·cep·tion·al|इक्स-सेप-शन-ल|असाधारण
contemporary|con·tem·po·rar·y|कन-टेम-पो-रे-री|आज के समय का
contradiction|con·tra·dic·tion|कॉन-ट्र-डिक-शन|विरोधाभास, उल्टी बात
irrelevant|ir·rel·e·vant|इ-रेल-इ-वंट|बेमतलब, जिसका बात से संबंध न हो`)},
{t:'Me and the Ecology Bit',a:'Joan Lexau',g:'जिम पेपर बाँटने का काम करता है और सबको पर्यावरण बचाने की सलाह देता है। पर जब वो अलग-अलग पड़ोसियों से कहता है, तो हर कोई उसकी अपनी गलतियाँ गिना देता है। आख़िर में वो मानता है कि पर्यावरण की बात सब करते हैं, पर करता कोई नहीं।',v:mkV(`ecology|e·col·o·gy|इ-कॉल-ओ-जी|पर्यावरण और जीवों के रिश्ते का विज्ञान
preservation|pres·er·va·tion|प्रेज़-र-वे-शन|संरक्षण, बचाकर रखना
participate|par·tic·i·pate|पार-टिस-इ-पेट|हिस्सा लेना
aluminium|al·u·min·i·um|अल-यू-मिन-इ-अम|एक हल्की चाँदी जैसी धातु
pretend|pre·tend|प्री-टेंड|दिखावा करना, बहाना बनाना
compost|com·post|कॉम-पोस्ट|कचरे से बनी खाद
garbage|gar·bage|गार-बिज|कचरा
pollution|pol·lu·tion|प-लू-शन|प्रदूषण
wrapper|wrap·per|रैप-पर|लपेटने वाला कागज़, रैपर
leash|leash|लीश|कुत्ते का पट्टा
innings|in·nings|इन-निंग्ज़|क्रिकेट में बैटिंग या बॉलिंग की बारी
snowmobile|snow·mo·bile|स्नो-मो-बील|बर्फ़ पर चलने वाली गाड़ी`)}];
const XV=mkV(`grateful|grate·ful|ग्रेट-फुल|आभारी
financial|fi·nan·cial|फाइ-नैन-शल|आर्थिक, पैसों का
scholarship|schol·ar·ship|स्कॉल-र-शिप|छात्रवृत्ति
confidence|con·fi·dence|कॉन-फि-डेंस|आत्मविश्वास
conversation|con·ver·sa·tion|कॉन-वर-से-शन|बातचीत
talented|tal·ent·ed|टैल-न-टिड|प्रतिभाशाली
extremely|ex·treme·ly|इक्स-ट्रीम-ली|बहुत ज़्यादा
serious|se·ri·ous|सिअ-रि-अस|गंभीर
wonderful|won·der·ful|वन-डर-फुल|शानदार`);
const BKW={};[...BK.flatMap(b=>b.v),...XV].forEach(x=>{BKW[x.w]=x});
const STORIES=[
{t:'The Mango Tree',l:1,e:'Ravi has a small mango tree in his garden. Every morning he gives it water. One day a strong wind comes and the tree falls down. Ravi is sad, but his friends help him. They plant the tree again, and soon it grows tall.',g:'रवि के बगीचे में आम का छोटा पेड़ है। तेज़ हवा से पेड़ गिर जाता है, पर दोस्त मिलकर उसे दोबारा लगा देते हैं।'},
{t:'The Lost Wallet',l:2,e:'On the way to school, Meena found a wallet on the road. It was full of money, but she did not keep it. She walked to the police station and gave it to an officer. The owner came to thank her, and he was extremely grateful.',g:'मीना को सड़क पर भरा हुआ बटुआ मिलता है। वह उसे पुलिस को दे देती है, और मालिक उसका शुक्रिया अदा करता है।'},
{t:'A Difficult Decision',l:3,e:'Aman was a talented student, but his family faced a serious financial problem. He had to make a difficult decision: continue his education or start working. After a long conversation with his teacher, he found a wonderful opportunity. A scholarship gave him confidence, and his determination finally changed his future.',g:'अमन के परिवार पर पैसों की मुश्किल आती है और उसे पढ़ाई या काम में से एक चुनना है। शिक्षक से बात करने पर उसे छात्रवृत्ति का मौका मिलता है और उसका पक्का इरादा उसका भविष्य बदल देता है।'}];
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function lookup(w){return BKW[w]||WORDS.find(z=>z.w===w)||{w,s:syl(w)}}
function rdHtml(t){return t.replace(/([A-Za-z][A-Za-z'’-]*)|([^A-Za-z]+)/g,(m,a,b)=>{if(!a)return esc(b);const w=a.toLowerCase().replace(/[^a-z]/g,''),k=lookup(w);return '<span class="w'+(k.m?' k':syl(w).length>=4?' h':'')+'" data-w="'+w+'">'+a+'</span>'}).replace(/\n/g,'<br>')}
function rdTap(ev){const e=ev.target&&ev.target.closest?ev.target.closest('.w'):null;if(e)wordSheet(e.dataset.w)}
function wordSheet(w){
  const x=lookup(w);cur=x;
  openSheet('<h3 style="font-size:1.6rem">'+x.w+'</h3><div class="chips">'+x.s.map((p,k)=>'<button class="chip" onclick="sheetChip('+k+')"><b>'+p+'</b>'+(x.h?'<small>'+x.h[k]+'</small>':'')+'</button>').join('<i>·</i>')+'</div>'+(x.h?'<p style="margin-top:.5rem">बोलो: <b style="color:#fff">'+x.h.join('')+'</b></p>':'')+'<div class="mn" style="margin:.4rem 0 .7rem">'+(x.m||'<span style="color:var(--mu);font-size:.9rem">इस word का मतलब अभी ऐप में नहीं है</span>')+'</div><div class="acts"><button class="ic" onclick="say(cur.w)" aria-label="सुनो">'+ico('sp')+'</button><button class="ic" onclick="slowPlay()" aria-label="धीमा सुनो"><span class="tt">🐢</span></button><button class="ic'+(saved(x)?' on':'')+'" onclick="saveW(this)" aria-label="डायरी में रखो">'+ico('bm')+'</button></div><button class="cta" onclick="openWord()">📖 पूरा कार्ड खोलो</button><button class="sec" onclick="closeSheet()">बंद करो</button>');
}
function sheetChip(k){tick();stopS();bounce($$('#sp .chip')[k]);piece(cur,k)}
function openWord(){cx=Object.assign({},cur,{bk:'किताब'});tab('learn')}
let bkm='lesson',bkL=null,bkS=null,gistOn=false;
function book(){
  $('#main').innerHTML='<div class="seg">'+[['lesson','पाठ के शब्द'],['story','कहानी'],['mine','मेरा पाठ']].map(m=>'<button class="'+(bkm===m[0]?'on':'')+'" onclick="setBk(\''+m[0]+'\')">'+m[1]+'</button>').join('')+'</div><section class="card bk" id="bk"></section>';
  ({lesson:lessonView,story:storyView,mine:mineView})[bkm]();
}
function setBk(m){bkm=m;bkL=null;bkS=null;stopS();book()}
const KEYS='<div class="note">हरी लाइन: मतलब मिलेगा · बिंदु वाली लाइन: भारी word</div>';
function lessonView(){
  const b=$('#bk');
  if(bkL===null){b.innerHTML='<div class="cnt">अपनी किताब का पाठ चुनो</div>'+BK.map((l,k)=>'<button class="lcard" onclick="openLesson('+k+')"><b>'+l.t+'</b><small>'+l.a+' · '+l.v.length+' शब्द</small></button>').join('')+'<div class="note">पाठ का पूरा लिखा हुआ हिस्सा यहाँ नहीं है। उसे <b>मेरा पाठ</b> में paste करके पढ़ो।</div>';return}
  const l=BK[bkL];
  b.innerHTML='<div class="wd" style="font-size:1.3rem;margin:0">'+l.t+'</div><div class="cnt">'+l.a+'</div><div class="sum">'+l.g+'</div><div class="wgrid">'+l.v.map((x,k)=>'<button class="chip" onclick="lessonWord('+k+')"><b>'+x.w+'</b></button>').join('')+'</div><div class="acts" style="margin-top:auto"><button class="sec" onclick="openLesson(null)">← पाठ</button><button class="cta" onclick="lessonWord(0)">▶ सब शब्द सीखो</button></div>';
}
function openLesson(k){bkL=k;book()}
function lessonWord(k){const l=BK[bkL];cx=Object.assign({},l.v[k],{lst:l.v,ix:k,bk:l.t});tab('learn')}
function storyView(){
  const b=$('#bk');
  if(bkS===null){b.innerHTML='<div class="cnt">एक कहानी चुनो</div>'+STORIES.map((s,k)=>'<button class="lcard" onclick="openStory('+k+')"><b>'+s.t+'</b><small>'+LVN[s.l]+' · हर word पर टैप करो</small></button>').join('');return}
  const s=STORIES[bkS];
  b.innerHTML='<div class="wd" style="font-size:1.3rem;margin:0">'+s.t+'</div><div class="rd" onclick="rdTap(event)">'+rdHtml(s.e)+'</div>'+KEYS+(gistOn?'<div class="sum">'+s.g+'</div>':'')+'<div class="acts"><button class="sec" onclick="openStory(null)">← कहानियाँ</button><button class="ic" onclick="say(STORIES[bkS].e)" aria-label="कहानी सुनो">'+ico('sp')+'</button><button class="sec" onclick="gistOn=!gistOn;storyView()">हिंदी सार</button></div>';
}
function openStory(k){bkS=k;gistOn=false;stopS();book()}
function mineView(){
  const b=$('#bk');
  if(!S.mine){b.innerHTML='<div class="cnt">किताब का पैराग्राफ यहाँ डालो</div><textarea class="ta" id="ta" placeholder="यहाँ paste करो या टाइप करो…" spellcheck="false"></textarea><div class="note">कैमरा या Google Lens से पैराग्राफ कॉपी करके paste कर सकते हो। ये सिर्फ आपके फोन में रहता है।</div><button class="cta" onclick="mineSave()">📖 पढ़ो</button>';return}
  b.innerHTML='<div class="rd" onclick="rdTap(event)">'+rdHtml(S.mine)+'</div>'+KEYS+'<div class="acts"><button class="sec" onclick="mineEdit()">✏️ बदलो</button><button class="ic" onclick="say(S.mine.slice(0,600))" aria-label="सुनो">'+ico('sp')+'</button><button class="sec" onclick="mineDel()">🗑 हटाओ</button></div>';
}
function mineSave(){const t=($('#ta').value||'').trim();if(!t)return;S.mine=t.slice(0,6000);store();mineView()}
function mineEdit(){const t=S.mine;S.mine='';mineView();$('#ta').value=t}
function mineDel(){S.mine='';store();mineView()}
/* ---- diary / profile / tabs ---- */
function diary(){
  const a=S.diary;
  $('#main').innerHTML='<div class="cnt" style="text-align:left;font-size:.95rem">🔖 कुल सेव words: <b style="color:#fff">'+a.length+'</b></div><div class="dl">'+(a.length?a.map((x,k)=>'<div class="di"><div><b>'+x.w+'</b><small>'+x.s.join(' · ')+(x.h?' · '+x.h.join(''):'')+'</small><small>'+(x.m||'')+'</small></div><button class="ic" onclick="dSay('+k+')" aria-label="सुनो">'+ico('sp')+'</button><button class="ic" onclick="dDel('+k+')" aria-label="हटाओ">'+ico('tr')+'</button></div>').join(''):'<section class="card" style="text-align:center">अभी कुछ सेव नहीं है।<br><span class="cnt">किसी word के कार्ड पर 🔖 दबाओ।</span></section>')+'</div>';
}
function dSay(k){say(S.diary[k].w)}
function dDel(k){S.diary.splice(k,1);store();diary();toast('Word removed')}
function profile(){
  const L=Math.floor(S.xp/100)+1;
  openSheet('<div class="orb sm">'+LOGO+'</div><h3>इंग्लिश शब्द तोड़ो</h3><p>Level '+L+' · ⭐ '+S.xp+' XP · 🔥 '+S.streak+' दिन</p><div class="srow"><span>❤️ दिल</span><b>'+S.hearts+' / 5</b></div><div class="srow"><span>🔖 सेव किए words</span><b>'+S.diary.length+'</b></div><a class="sec" href="'+IG+'" target="_blank" rel="noopener">📸 Instagram पर जुड़ो</a><p class="cr">❤️ Created by Anuj | All Rights Reserved</p><button class="cta" onclick="closeSheet()">बंद करो</button>');
}
const TABS=[['learn','सीखो'],['book','किताब'],['build','जोड़ो'],['quiz','क्विज़'],['diary','डायरी']];
function tab(t){
  stopS();closeSheet();tabn=t;
  $('#nav').innerHTML=TABS.map(x=>'<button class="'+(x[0]===t?'cur':'')+'" onclick="tab(\''+x[0]+'\')" aria-label="'+x[1]+'">'+ico(x[0])+x[1]+'</button>').join('');
  ({learn,book,build,quiz,diary})[t]();
}
$$('.lg').forEach(e=>{e.innerHTML=LOGO});
$('#bse').innerHTML=ico('se');$('#bpr').innerHTML=ico('us');
hud();tab('learn');setInterval(hud,30000);
setTimeout(()=>{const s=$('#splash');s.classList.add('hide');setTimeout(()=>s.remove(),500)},1500);
</script>
